<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Pincode Finder</title>

    <link rel="manifest" href="manifest.json">
    style.css?v=20
</head>

<body>

    <div class="container">

        <h1>India Pincode Finder</h1>

        <p class="subtitle">
            Search Any Pincode Across India
        </p>

        <button id="installBtn" class="install-btn" style="display:none;">
            📱 Install App
        </button>

        <input
            type="text"
            id="pin"
            placeholder="Enter Pincode">

        <button onclick="searchPincode()">
            Search
        </button>

        <br><br>

        <input
            type="text"
            id="area"
            placeholder="Enter Area / Post Office Name">

        <button onclick="searchArea()">
            Search By Area
        </button>

        <div id="result"></div>

    </div>

    script.js?v=20script>

</body>

</html>
