<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Pincode Finder</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo-section">
            <img
                src="iconIndia Pincode Finder</h1>

            <p class="subtitle">
                Search Any Pincode Across India
            </p>
        </div>

        <button id="installBtn" class="install-btn" style="display:none;">
            📱 Install App
        </button>

        <input
            type="text"
            id="pin"
            placeholder="Enter Pincode">

        <button onclick="searchPincode()">
            Search
        </button>

        <br><br>

        <input
            type="text"
            id="area"
            placeholder="Enter Area / Post Office Name">

        <button onclick="searchArea()">
            Search By Area
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
